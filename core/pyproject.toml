[project]
name = "hippo-core"
version = "0.1.0"
description = "Hippo's local core engine and command-line interface"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["typer>=0.16,<1.0"]

[project.scripts]
hippo = "hippo.cli:main"

[build-system]
requires = ["uv_build>=0.8.19,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hippo"
