[project]
name = "hippo-core"
version = "0.1.0"
description = "Hippo's local core engine and command-line interface"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.4",
    "typer>=0.16,<1.0",
]

[project.scripts]
hippo = "hippo.cli:main"

[build-system]
requires = ["uv_build>=0.8.19,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hippo"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.4",
]
